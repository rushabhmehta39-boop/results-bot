name: Probe (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python probe.py
      - name: Push samples to a temporary branch
        if: always()
        run: |
          mkdir -p /tmp/s && cp -r samples /tmp/s/ || exit 0
          git config user.name "results-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan pdf-samples
          git rm -rq --cached . && rm -rf ./* && cp -r /tmp/s/samples .
          git add samples && git commit -qm "Temporary PDF samples" && git push -qf origin pdf-samples
