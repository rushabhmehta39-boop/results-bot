; Only needed if you ever run the bot on a computer instead of GitHub.
; Copy this file to config.ini and fill in your values. Never share config.ini.

[settings]
TELEGRAM_BOT_TOKEN =
TELEGRAM_CHAT_ID =

; Only post results of companies with market cap at or above this (in ₹ crore)
MIN_MCAP_CR = 700

; Which exchanges to check: nse, nse_sme, bse
SOURCES = nse,nse_sme,bse

; on = short alert the moment the results PDF is out; the numbers card follows as a reply
INSTANT_ALERTS = on

; on = also build a website of all cards in the docs folder
WEBSITE = off

; Always-on mode (python results_bot.py --loop): seconds between checks
POLL_SECONDS = 40

; When only the standalone filing has arrived, how long to wait for the consolidated one:
; minutes for companies that only ever file standalone, hours when consolidated is expected
; (filed in past quarters, or the results announcement mentions it), hours when nothing is known yet
SETTLE_MINUTES = 15
CONSOLIDATED_WAIT_HOURS = 6
UNKNOWN_WAIT_HOURS = 2

; Name shown at the top of every card, and optional text at the bottom right (e.g. your channel name)
CARD_BRAND = Results Desk
CARD_FOOTER =
